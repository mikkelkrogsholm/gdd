[package]
name = "gdd-conformance"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local GDD conformance runner"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
gdd = { path = "../.." }
json-patch = { version = "4.2", default-features = false }
jsonschema-value = { version = "0.61.2", default-features = false, features = ["arbitrary-precision"] }
libyaml-safer = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
tempfile = "3.27"
time = { version = "0.3", features = ["formatting"] }
