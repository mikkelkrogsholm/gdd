[package]
name = "gdd-conformance"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local GDD conformance runner"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
gdd = { path = "../..", features = ["conformance"] }
json-patch = { version = "4.2", default-features = false }
jsonschema = { version = "0.61.2", default-features = false, features = ["arbitrary-precision"] }
jsonschema-value = { version = "0.61.2", default-features = false, features = ["arbitrary-precision"] }
libyaml-safer = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
sha1 = "0.10"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27"
time = { version = "0.3", features = ["formatting"] }
zlib-bitexact-rs = "=0.131.1"
