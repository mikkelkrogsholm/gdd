[package]
name = "gdd-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Native preview of a Graph-Driven Development model"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
gdd = { path = "../.." }
serde_json = "1.0"
graphlay = { version = "0.3.1", default-features = false }
tempfile = "3.27"
