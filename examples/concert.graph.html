<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'sha256-lGFlAWsoSwFYlpwFyYG7xfH/3hl9e87uaDEtUNtqda8='; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'"
    />
    <title>GDD · Grafvisning</title>
    <style>
      :root {
  color-scheme: light;
  --bg: #f5f6f2;
  --panel: #fff;
  --ink: #202b2c;
  --muted: #657171;
  --line: #dfe4df;
  --accent: #17695a;
  --soft: #e8f2ec;
  --canvas: #f1f4ef;
  --node: #fff;
  --edge: #a8b8b1;
  --action: #1c7869;
  --rule: #a57832;
  --entity: #5277a4;
  --screen: #8d699d;
  --community: #56645e;
  --scenario: #768b71;
  --focus: #156bba;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(min-content, 1fr) auto;
  background: var(--bg);
  color: var(--ink);
  font:
    14px/1.5 ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}
button,
input,
select {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 10px;
}
button:hover {
  background: var(--soft);
  border-color: var(--accent);
}
button:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}
button[aria-pressed="true"] {
  background: var(--soft);
  color: var(--accent);
  border-color: var(--accent);
}
header {
  min-height: 88px;
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 14px 28px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.brand {
  font-size: 30px;
  font-weight: 750;
  letter-spacing: -2px;
}
.brand-dot {
  color: var(--accent);
  font-size: 12px;
  vertical-align: top;
  letter-spacing: 0;
  padding-left: 3px;
}
.heading {
  min-width: 0;
  flex: 1;
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 1.6px;
  color: var(--muted);
  font-weight: 650;
}
h1 {
  font-size: 19px;
  line-height: 1.2;
  margin: 3px 0 0;
  font-weight: 600;
  overflow-wrap: anywhere;
}
.mode {
  color: var(--accent);
  background: var(--soft);
  border-radius: 4px;
  padding: 5px 8px;
  font-size: 12px;
  white-space: nowrap;
}
h2 {
  font-size: 15px;
  font-weight: 650;
  margin: 0;
}
.panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 0 20px;
}
.quiet,
.hint {
  color: var(--muted);
  font-size: 12px;
}
.hint {
  margin: 8px 0 18px;
}
.explorer {
  padding: 22px 18px;
  display: flex;
  flex-direction: column;
  min-height: min-content;
  background: var(--panel);
  border-right: 1px solid var(--line);
}
main {
  min-height: 550px;
  display: grid;
  grid-template-columns: 265px minmax(280px, 1fr) 340px;
}
label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  font-weight: 550;
  margin: 0 0 6px;
}
input[type="search"],
select {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 6px;
  padding: 9px 8px;
  min-width: 0;
}
input[type="search"] {
  margin-bottom: 16px;
}
.filter-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 15px;
}
.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 16px;
}
.switch-row label {
  margin: 0;
  color: var(--ink);
}
input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
}
.list-tabs {
  display: flex;
  border-bottom: 1px solid var(--line);
  gap: 6px;
  padding-bottom: 10px;
}
.list-tabs button {
  flex: 1;
  font-size: 12px;
}
.object-list {
  overflow: auto;
  min-height: 70px;
  flex: 1 1 70px;
  margin: 10px -8px;
}
.object-row {
  display: block;
  border: 0;
  border-radius: 5px;
  width: 100%;
  text-align: left;
  padding: 9px 8px;
  background: transparent;
  margin: 0 0 2px;
  overflow-wrap: anywhere;
}
.object-row .row-title {
  font-size: 12px;
  display: block;
  font-weight: 550;
}
.row-meta {
  font-size: 11px;
  color: var(--muted);
}
.type-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--community);
  margin-right: 6px;
}
.reset {
  margin-top: 10px;
  font-size: 12px;
}
.stage {
  position: relative;
  min-width: 0;
  overflow: hidden;
  background: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0)
    0 0/20px 20px;
  background-color: var(--canvas);
}
.stage-toolbar {
  position: absolute;
  top: 16px;
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  z-index: 1;
  pointer-events: none;
  align-items: center;
}
.stage-toolbar > * {
  pointer-events: auto;
}
.stage-toolbar > div {
  background: var(--panel);
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  font-size: 12px;
}
.stage-toolbar button {
  font-size: 11px;
}
.live-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 7px;
}
svg#graph {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  user-select: none;
}
#arrow path {
  fill: var(--edge);
}
.edge-path {
  fill: none;
  stroke: var(--edge);
  stroke-width: 1.5;
  marker-end: url(#arrow);
}
.edge-hit {
  fill: none;
  stroke: transparent;
  stroke-width: 16;
  cursor: pointer;
}
.edge-label {
  font-size: 10px;
  fill: var(--muted);
  paint-order: stroke;
  stroke: var(--canvas);
  stroke-width: 4px;
  stroke-linejoin: round;
  cursor: pointer;
}
.edge-group.selected .edge-path,
.edge-group.connected .edge-path {
  stroke: var(--accent);
  stroke-width: 2.2;
}
.edge-group.selected .edge-label {
  fill: var(--accent);
}
.node-glyph {
  fill: var(--node);
  stroke: var(--line);
  stroke-width: 1.5;
}
.node-group {
  cursor: grab;
}
.node-group.selected .node-glyph {
  stroke: var(--accent);
  stroke-width: 3;
}
.node-group.connected .node-glyph {
  stroke: var(--accent);
}
.node-group.dim {
  opacity: 0.22;
}
.edge-group.dim {
  opacity: 0.12;
}
.node-label {
  font-size: 11px;
  fill: var(--ink);
  font-weight: 550;
  text-anchor: middle;
  paint-order: stroke;
  stroke: var(--canvas);
  stroke-width: 3;
  stroke-linejoin: round;
}
.node-kind {
  font-size: 9px;
  fill: var(--muted);
  text-anchor: middle;
}
.node-symbol {
  font-size: 13px;
  fill: var(--ink);
  text-anchor: middle;
  font-weight: 650;
}
.node-group.folded .node-glyph {
  fill: var(--soft);
  stroke-dasharray: 4 3;
}
.node-group.sketch .node-glyph {
  stroke-dasharray: 3 3;
}
.canvas-note {
  position: absolute;
  bottom: 20px;
  left: 18px;
  color: var(--muted);
  font-size: 11px;
  max-width: 50%;
}
.zoom-controls {
  position: absolute;
  bottom: 16px;
  right: 16px;
  display: flex;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
}
.zoom-controls button {
  border: 0;
  background: transparent;
  border-radius: 0;
}
.zoom-controls span {
  font:
    11px ui-monospace,
    monospace;
  min-width: 40px;
  text-align: center;
}
#empty {
  position: absolute;
  top: 45%;
  left: 15%;
  right: 15%;
  text-align: center;
  background: var(--panel);
  padding: 20px;
  border-radius: 8px;
}
.inspector {
  padding: 22px;
  overflow: auto;
  min-width: 0;
  min-height: 0;
  /* Details scroll without setting the graph row's intrinsic minimum height. */
  contain: size;
  border-left: 1px solid var(--line);
  background: var(--panel);
}
.detail-tag {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.3px;
  color: var(--accent);
  font-weight: 650;
}
.detail-title {
  font-size: 22px;
  line-height: 1.25;
  margin: 10px 0 9px;
  overflow-wrap: anywhere;
  letter-spacing: -0.4px;
}
.canonical-id {
  font:
    11px/1.6 ui-monospace,
    SFMono-Regular,
    monospace;
  overflow-wrap: anywhere;
  color: var(--muted);
  margin: 0 0 15px;
}
.detail-description {
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 20px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.badge {
  display: inline-block;
  border: 1px solid var(--line);
  font-size: 11px;
  border-radius: 4px;
  padding: 2px 6px;
  margin: 0 5px 8px 0;
}
.detail-section {
  margin-top: 24px;
  border-top: 1px solid var(--line);
  padding-top: 16px;
}
.detail-section h3 {
  font-size: 12px;
  margin: 0 0 10px;
  font-weight: 650;
}
.detail-section p {
  font-size: 12px;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.kv {
  display: grid;
  grid-template-columns: 85px 1fr;
  gap: 8px;
  margin: 8px 0;
  font-size: 12px;
}
.kv dt {
  color: var(--muted);
}
.kv dd {
  margin: 0;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
pre {
  font:
    11px/1.75 ui-monospace,
    SFMono-Regular,
    monospace;
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 12px;
  border-radius: 6px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 380px;
  overflow: auto;
}
details {
  margin: 12px 0;
}
summary {
  cursor: pointer;
  font-size: 12px;
  font-weight: 550;
}
.detail-link {
  width: 100%;
  text-align: left;
  font-size: 11px;
  padding: 8px;
  margin-bottom: 5px;
  overflow-wrap: anywhere;
}
.notice {
  border-left: 3px solid var(--rule);
  padding: 8px 10px;
  background: var(--bg);
  font-size: 12px;
  color: var(--muted);
}
footer {
  height: 35px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  font:
    10px ui-monospace,
    monospace;
  color: var(--muted);
}
footer span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#revision {
  max-width: 40%;
}
.type-action {
  --type: var(--action);
}
.type-entity {
  --type: var(--entity);
}
.type-rule {
  --type: var(--rule);
}
.type-screen {
  --type: var(--screen);
}
.type-community {
  --type: var(--community);
}
.type-scenario {
  --type: var(--scenario);
}
.type-component,
.type-machine {
  --type: var(--community);
}
.type-dot,
.node-accent {
  fill: var(--type, var(--community));
  background: var(--type, var(--community));
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #1d2524;
    --panel: #222d2b;
    --ink: #e4eae5;
    --muted: #acb9b1;
    --line: #3c4c46;
    --accent: #8aceb3;
    --soft: #2e433a;
    --canvas: #1a2320;
    --node: #2a3932;
    --edge: #72867a;
    --action: #71bda6;
    --rule: #d0ab6e;
    --entity: #96b6db;
    --screen: #be9fd0;
    --community: #a9b9b0;
    --scenario: #b0c7a3;
    --focus: #93c4ff;
  }
}
@media (max-width: 1150px) {
  main {
    grid-template-columns: 235px minmax(280px, 1fr) 290px;
  }
  .inspector {
    padding: 18px;
  }
  .stage-toolbar {
    flex-wrap: wrap;
  }
  .mode {
    display: none;
  }
}
@media (max-width: 850px) {
  body {
    display: block;
  }
  header {
    padding: 12px 16px;
    gap: 14px;
    min-height: 78px;
  }
  h1 {
    font-size: 16px;
  }
  .eyebrow {
    font-size: 9px;
  }
  header button {
    font-size: 11px;
  }
  main {
    height: auto;
    min-height: 0;
    grid-template-columns: 220px minmax(0, 1fr);
    grid-template-rows: minmax(min-content, 65dvh) auto;
  }
  .stage {
    min-height: 400px;
  }
  .explorer {
    grid-row: 1;
    padding: 18px 12px;
  }
  .inspector {
    contain: none;
    grid-column: 1/-1;
    border-left: 0;
    border-top: 1px solid var(--line);
    max-height: none;
  }
  footer {
    position: static;
    height: auto;
    min-height: 35px;
    flex-wrap: wrap;
    gap: 4px 12px;
  }
  .canvas-note {
    display: none;
  }
  .stage-toolbar {
    left: 10px;
    right: 10px;
  }
  .stage-toolbar button {
    font-size: 10px;
  }
}
@media (max-width: 520px) {
  header {
    height: auto;
    min-height: 78px;
  }
  .brand {
    font-size: 25px;
  }
  .heading {
    flex: 1;
  }
  .eyebrow {
    letter-spacing: 0.6px;
  }
  main {
    display: flex;
    flex-direction: column;
  }
  .stage {
    height: 60dvh;
    min-height: 380px;
    order: 0;
  }
  .explorer {
    order: 1;
    border-right: 0;
    border-top: 1px solid var(--line);
  }
  .inspector {
    order: 2;
  }
  .object-list {
    flex-basis: auto;
    max-height: 230px;
    min-height: 80px;
  }
  .panel-heading {
    margin-bottom: 12px;
  }
  .filter-row {
    grid-template-columns: 1fr 1fr;
  }
  .hint {
    margin-bottom: 10px;
  }
  header > button {
    max-width: 80px;
  }
  #revision {
    max-width: 100%;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
  }
}
.edge-label {
  opacity: 0;
}
.edge-group:hover .edge-label,
.edge-group.connected .edge-label,
.edge-group.selected .edge-label {
  opacity: 1;
}
.node-symbol,
.node-accent {
  pointer-events: none;
}
.node-group:hover .node-glyph {
  stroke: var(--accent);
  stroke-width: 2.5;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
;
    </style>
  </head>
  <body>
    <header>
      <div class="brand" aria-label="Graph Driven Development">
        gdd<span class="brand-dot">●</span>
      </div>
      <div class="heading">
        <span class="eyebrow">GRAPH DRIVEN DEVELOPMENT</span>
        <h1 id="project-title"></h1>
      </div>
      <span class="mode">Læsevisning · GDD 0.2</span>
      <button id="overview">Om modellen</button>
    </header>
    <p id="selection-status" class="sr-only" role="status" aria-live="polite"></p>
    <main>
      <aside class="explorer" aria-label="Udforsk grafen">
        <div class="panel-heading">
          <h2>Udforsk</h2>
          <span id="total-count" class="quiet"></span>
        </div>
        <label for="search">Søg i noder og relationer</label>
        <input
          id="search"
          type="search"
          placeholder="ID, beskrivelse eller pseudokode…"
          autocomplete="off"
        />
        <div class="filter-row">
          <div>
            <label for="kind">Nodetype</label
            ><select id="kind">
              <option value="">Alle typer</option>
            </select>
          </div>
          <div>
            <label for="relation">Relation</label
            ><select id="relation">
              <option value="">Alle relationer</option>
            </select>
          </div>
        </div>
        <label for="community">Community</label
        ><select id="community">
          <option value="">Hele grafen</option>
        </select>
        <div class="switch-row">
          <label for="scenarios"
            >Vis scenarier <span id="scenario-count"></span></label
          ><input id="scenarios" type="checkbox" />
        </div>
        <div class="switch-row">
          <label for="fold">Fold communities</label
          ><input id="fold" type="checkbox" />
        </div>
        <p class="hint" id="fold-hint">
          Medlemskab er gruppering, ikke ejerskab.
        </p>
        <div class="list-tabs" role="group" aria-label="Objektliste">
          <button id="tab-nodes" aria-pressed="true">Noder</button
          ><button id="tab-edges" aria-pressed="false">Relationer</button>
        </div>
        <div
          id="object-list"
          class="object-list"
          aria-label="Synlige objekter"
        ></div>
        <button id="reset" class="reset">Nulstil filtre og foldning</button>
      </aside>
      <section class="stage" aria-label="Interaktiv graf">
        <div class="stage-toolbar">
          <div>
            <span class="live-dot"></span
            ><span id="view-count" role="status" aria-live="polite"></span>
          </div>
          <button id="manifest-download">Hent visningsmanifest</button>
        </div>
        <svg
          id="graph"
          role="img"
          aria-label="GDD-graf. Brug objektlisten til tastaturinspektion."
        >
          <defs>
            <marker
              id="arrow"
              viewBox="0 0 10 10"
              refX="9"
              refY="5"
              markerWidth="7"
              markerHeight="7"
              orient="auto-start-reverse"
            >
              <path d="M 0 0 L 10 5 L 0 10 z" />
            </marker>
          </defs>
          <g id="viewport">
            <g id="edge-layer"></g>
            <g id="node-layer"></g>
          </g>
        </svg>
        <div id="empty" hidden>
          Ingen noder matcher filtrene. Nulstil filtrene for at se grafen igen.
        </div>
        <div class="canvas-note">
          Træk for at flytte · Rul for at zoome · Vælg en node eller forbindelse
        </div>
        <div class="zoom-controls" role="group" aria-label="Grafnavigation">
          <button id="zoom-out" aria-label="Zoom ud">−</button
          ><span id="zoom-level">100%</span
          ><button id="zoom-in" aria-label="Zoom ind">+</button
          ><button id="fit">Tilpas</button>
        </div>
      </section>
      <aside id="inspector" class="inspector" aria-label="Detaljer">
        <div id="detail"></div>
      </aside>
    </main>
    <footer>
      <span id="revision"></span><span id="projection-status"></span

agelse til SoldOut.\\nKun en ny n\u00f8gle fors\u00f8ger at oprette en ny reservation.\\nAfvis en ny reservation med SoldOut, n\u00e5r antallet af reservationer i reserved er lig kapaciteten.\\nN\u00f8gleunikhed, kapacitetsbeskyttelse, oprettelse og n\u00f8glebinding skal indg\u00e5 i samme atomare databaseoperation eller transaktion.\\nSamtidige transaktioner skal give et resultat svarende til en gyldig sekventiel r\u00e6kkef\u00f8lge for disse regler; en check-then-insert uden beskyttelse er ikke nok.\\nEn mislykket oprettelse binder ikke request-n\u00f8glen og efterlader ingen reservation.\"\n}"}, "community.backend": {"fields": {"description": "Backend-visning af den f\u00e6lles model.", "kind": "community"}, "full": "{\n  \"kind\": \"community\",\n  \"description\": \"Backend-visning af den f\u00e6lles model.\"\n}"}, "community.frontend": {"fields": {"description": "Frontend-visning af den f\u00e6lles model.", "kind": "community"}, "full": "{\n  \"kind\": \"community\",\n  \"description\": \"Frontend-visning af den f\u00e6lles model.\"\n}"}, "component.api": {"fields": {"description": "Validerer transportinput og videresender autentificeret kontekst.", "interfaces": "[\n  \"action.reserve\",\n  \"action.cancel\"\n]", "kind": "component", "maturity": "specified", "source_refs": "[\n  {\n    \"source\": \"source.legacy\",\n    \"purpose\": \"provenance\"\n  }\n]"}, "full": "{\n  \"kind\": \"component\",\n  \"description\": \"Validerer transportinput og videresender autentificeret kontekst.\",\n  \"maturity\": \"specified\",\n  \"source_refs\": [\n    {\n      \"source\": \"source.legacy\",\n      \"purpose\": \"provenance\"\n    }\n  ],\n  \"interfaces\": [\n    \"action.reserve\",\n    \"action.cancel\"\n  ]\n}"}, "component.frontend": {"fields": {"description": "Planlagt brugerflade; skitse uden teknologistak.", "kind": "component", "maturity": "sketch"}, "full": "{\n  \"kind\": \"component\",\n  \"description\": \"Planlagt brugerflade; skitse uden teknologista     camera = {
      x: x - (x - camera.x) * ratio,
      y: y - (y - camera.y) * ratio,
      k: next,
    };
    applyCamera();
  }
  let drag = null,
    dragged = false;
  function startDrag(event, id = null) {
    if (event.button !== 0) return;
    event.stopPropagation();
    dragged = false;
    drag = {
      id,
      x: event.clientX,
      y: event.clientY,
      startX: event.clientX,
      startY: event.clientY,
    };
    $("graph").setPointerCapture(event.pointerId);
  }
  $("graph").addEventListener("pointerdown", (event) => {
    if (!event.target.closest(".edge-group")) startDrag(event);
  });
  $("graph").addEventListener("pointermove", (event) => {
    if (!drag) return;
    const dx = event.clientX - drag.x,
      dy = event.clientY - drag.y;
    if (
      Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) > 3
    )
      dragged = true;
    if (drag.id) {
      const p = positions.get(drag.id);
      p.x += dx / camera.k;
      p.y += dy / camera.k;
      draw();
    } else {
      camera.x += dx;
      camera.y += dy;
      applyCamera();
    }
    drag.x = event.clientX;
    drag.y = event.clientY;
  });
  function endDrag() {
    if (drag?.id && !dragged) GDD.select("node", drag.id);
    drag = null;
    setTimeout(() => {
      dragged = false;
    }, 0);
  }
  $("graph").addEventListener("pointerup", endDrag);
  $("graph").addEventListener("pointercancel", () => {
    drag = null;
    dragged = false;
  });
  $("graph").addEventListener(
    "wheel",
    (event) => {
      event.preventDefault();
      const r = $("graph").getBoundingClientRect();
      zoom(
        Math.exp(-event.deltaY * 0.0015),
        event.clientX - r.left,
        event.clientY - r.top,
      );
    },
    { passive: false },
  );
  $("zoom-in").onclick = () => zoom(1.2);
  $("zoom-out").onclick = () => zoom(1 / 1.2);
  $("fit").onclick = fit;
  return {
    data,
    model,
    $,
    state,
    el,
    label,
    memberships,
    communities,
    kinds,
    project,
    layout,
    draw,
    fit,
    highlight,
    manifest,
    get projection() {
      return projection;
    },
  };
})();

/* Canonical model records are always rendered as text. */
(() => {
  const { data, model, $, state, el, label, memberships } = GDD;
  const detail = $("detail");
  function section(title) {
    const box = el("section", undefined, "detail-section");
    box.append(el("h3", title));
    detail.append(box);
    return box;
  }
  function raw(parent, title, value, open = false, exact = null) {
    const box = el("details"),
      summary = el("summary", title);
    box.open = open;
    box.append(
      summary,
      el(
        "pre",
        exact ??
          (typeof value === "string" ? value : JSON.stringify(value, null, 2)),
      ),
    );
    parent.append(box);
  }
  function button(parent, text, type, id) {
    const item = el("button", text, "detail-link");
    item.onclick = () => GDD.select(type, id);
    parent.append(item);
    return item;
  }
  function heading(tag, title, id, description) {
    detail.replaceChildren(
      el("span", tag, "detail-tag"),
      el("h2", title, "detail-title"),
    );
    if (id) detail.append(el("p", id, "canonical-id"));
    if (description) detail.append(el("p", description, "detail-description"));
  }
  function kv(parent, key, value) {
    const row = el("dl", undefined, "kv");
    row.append(el("dt", key), el("dd", String(value)));
    parent.append(row);
  }
  function location(id) {
    const box = section("Kanonisk placering");
    const loc = data.locations[id];
    if (loc) kv(box, "Fil / pointer", `${loc[0]}${loc[1]}`);
    kv(box, "Modelrevision", data.spec_revision);
  }
  function sourceReferences(node, id) {
    const references = [
      ...(node.source_refs || []),
      ...(node.design_refs || []),
    ];
    if (!references.length) return;
    const box = section("Kilder og designreferencer");
    references.forEach((ref, index) => {
      button(box, ref.source, "source", ref.source);
      raw(box, "Reference", ref, false, data.text.references[id][index]);
    });
  }
  function edgeDetails(edge) {
    heading("Kanonisk relation", edge.relation, edge.id, edge.description);
    const box = section("Retning");
    button(box, `${edge.from} →`, "node", edge.from);
    button(box, `→ ${edge.to}`, "node", edge.to);
    const peers = model.edges.filter(
      (e) => e.from === edge.from && e.to === edge.to,
    );
    if (peers.length > 1) {
      const group = section(`${peers.length} parallelle relationer`);
      peers.forEach((e) =>
        button(group, `${e.id} · ${e.relation}`, "edge", e.id),
      );
    }
    sourceReferences(edge, edge.id);
    location(edge.id);
    raw(detail, "Alle relationsfelter", edge, true, data.text.edges[edge.id]);
  }
  function nodeDetails(id) {
    const node = model.nodes[id];
    heading(node.kind, label(id), id, node.description);
    detail.append(
      el(
        "span",
        node.maturity === "specified" ? "Specified" : "Sketch (standardværdi)",
        "badge",
      ),
    );
    detail.append(
      el(
        "p",
        "Maturity beskriver modellens detaljering. Parathed og implementation vurderes separat.",
        "notice",
      ),
    );
    const memberOf = memberships.get(id);
    if (memberOf.length) {
      const box = section("Medlem af communities");
      memberOf.forEach((c) => button(box, label(c), "node", c));
    }
    if (node.behavior !== undefined) {
      const box = section("Pseudokode / adfærd");
      raw(
        box,
        "Vis adfærd",
        node.behavior,
        true,
        data.text.nodes[id].fields.behavior,
      );
    }
    if (node.contract) {
      const box = section("Kontrakt");
      raw(
        box,
        "Input, output, fejl og effekter",
        node.contract,
        true,
        data.text.nodes[id].fields.contract,
      );
    }
    for (const key of [
      "fields",
      "rule",
      "scenario",
      "machine",
      "interaction",
      "realization",
    ])
      if (node[key] !== undefined)
        raw(
          section(key),
          `Vis ${key}`,
          node[key],
          true,
          data.text.nodes[id].fields[key],
        );
    if (node.kind === "community") {
      const members = [...memberships]
        .filter(([, groups]) => groups.includes(id))
        .map(([member]) => member);
      const box = section(`${members.length} medlemmer`);
      members.forEach((member) =>
        button(
          box,
          `${label(member)}${memberships.get(member).length > 1 ? " · overlap" : ""}`,
          "node",
          member,
        ),
      );
      const internals = GDD.projection.edges.filter(
        (e) =>
          GDD.projection.internal.includes(e.id) &&
          GDD.projection.representatives.get(e.from) === id,
      );
      if (internals.length) {
        const internalBox = section(
          `${internals.length} foldede interne relationer`,
        );
        internals.forEach((e) =>
          button(internalBox, `${e.id} · ${e.relation}`, "edge", e.id),
        );
      }
    }
    const related = model.edges.filter((e) => e.from === id || e.to === id);
    if (related.length) {
      const box = section(`Relationer · ${related.length}`);
      related.forEach((e) =>
        button(
          box,
          `${e.from === id ? "→" : "←"} ${e.relation} · ${e.from === id ? e.to : e.from}\n${e.id}`,
          "edge",
          e.id,
        ),
      );
    }
    const questions = Object.entries(model.questions || {}).filter(([, q]) =>
      q.targets.includes(id),
    );
    if (questions.length) {
      const box = section("Åbne spørgsmål / modeldata");
      questions.forEach(([qid, q]) =>
        raw(box, qid, q, true, data.text.questions[qid].full),
      );
    }
    sourceReferences(node, id);
    location(id);
    raw(detail, "Alle nodefelter", node, false, data.text.nodes[id].full);
  }
  function overview() {
    heading(
      "Modeloversigt",
      model.project.title,
      model.project.id,
      model.project.goal,
    );
    detail.append(
      el(
        "p",
        "Udforsk intention, kontrakter og pseudokode. Denne visning skriver aldrig tilbage til modellen.",
        "notice",
      ),
    );
    const counts = section("Grafen");
    kv(counts, "Noder", Object.keys(model.nodes).length);
    kv(counts, "Relationer", model.edges.length);
    kv(
      counts,
      "Scope",
      data.scope.length ? data.scope.join(", ") : "Hele modellen",
    );
    const legend = section("Nodetyper");
    for (const kind of [
      ...new Set(Object.values(model.nodes).map((n) => n.kind)),
    ].sort()) {
      const row = el("p"),
        dot = el(
          "span",
          undefined,
          `type-dot type-${GDD.kinds.includes(kind) ? kind : "component"}`,
        );
      row.append(dot, document.createTextNode(kind));
      legend.append(row);
    }
    legend.append(
      el(
        "p",
        "Stiplet node: sketch eller foldet community. Pile viser relationens retning. ×N er et inspecterbart relationsbundt.",
      ),
    );
    const sources = Object.keys(model.sources || {});
    if (sources.length) {
      const box = section("Kilder · separat fra intention");
      sources.forEach((id) => button(box, id, "source", id));
    }
    const questions = Object.entries(model.questions || {});
    if (questions.length) {
      const box = section("Spørgsmål");
      questions.forEach(([id, q]) =>
        raw(box, id, q, false, data.text.questions[id].full),
      );
    }
    const revisions = section("Sporbarhed");
    kv(revisions, "Revision", data.spec_revision);
    kv(
      revisions,
      "Generator",
      `${data.generator.name} ${data.generator.version}`,
    );
    kv(
      revisions,
      "Observationer",
      "Ingen observationsinputs i denne projektion",
    );
    revisions.append(
      el(
        "p",
        "Visningen viser modeldata. Den beregner ingen parathed eller implementeringsevidens.",
      ),
    );
    raw(detail, "Modelsnapshot", data.snapshot, false, data.text.snapshot);
    raw(detail, "Aktuelt visningsmanifest", GDD.manifest());
    raw(detail, "Projektfelter", model.project, false, data.text.project);
  }
  GDD.select = (type, id) => {
    state.selected = type ? { type, id } : null;
    $("selection-status").textContent = type
      ? `Valgt ${type}: ${id}`
      : "Modeloversigt";
    for (const item of $("object-list").children) {
      if (item.tagName === "BUTTON")
        item.setAttribute(
          "aria-pressed",
          (type === "node" || type === "edge") &&
            item.getAttribute(
              type === "node" ? "data-list-node" : "data-list-edge",
            ) === id,
        );
    }
    if (type === "node") nodeDetails(id);
    else if (type === "edge") edgeDetails(model.edges.find((e) => e.id === id));
    else if (type === "bundle") {
      const bundle = GDD.projection.bundles.find((b) => b.key === id);
      heading(
        "Rettet relationsbundt",
        `${bundle.edges.length} relationer`,
        `${bundle.from} → ${bundle.to}`,
      );
      detail.append(
        el(
          "p",
          "Hvert ID er en selvstændig kanonisk relation. Bundtet ændrer kun tegningen.",
          "notice",
        ),
      );
      const box = section("Alle relationer");
      bundle.edges.forEach((e) =>
        button(
          box,
          `${e.id}\n${e.from} → ${e.to} · ${e.relation}`,
          "edge",
          e.id,
        ),
      );
    } else if (type === "source") {
      heading("Kilde · separat fra intention", id, id);
      detail.append(
        el(
          "p",
          "Kildepåstande og planlagte referencer er ikke verificeret implementeringsevidens.",
          "notice",
        ),
      );
      raw(
        detail,
        "Kildedata",
        model.sources[id],
        true,
        data.text.sources[id].full,
      );
      location(id);
    } else overview();
    $("inspector").scrollTop = 0;
    if (type && window.matchMedia("(max-width: 850px)").matches)
      $("inspector").scrollIntoView({ block: "start", behavior: "instant" });
    GDD.highlight();
  };
  GDD.showOverview = () => GDD.select(null, null);
})();

/* Browser controls operate only on local view state. */
(() => {
  const { data, model, $, state, el, label } = GDD;
  $("project-title").textContent = model.project.title;
  $("renderer-meta").textContent = `${data.generator.name} ${data.generator.version} · Offline`;
  document.title = `${model.project.title} · GDD`;
  $("total-count").textContent = `${Object.keys(model.nodes).length} noder`;
  $("revision").textContent = `Model ${data.spec_revision}`;
  $("revision").title = data.spec_revision;
  function option(select, value, title) {
    const item = el("option", title);
    item.value = value;
    $(select).append(item);
  }
  [...new Set(Object.values(model.nodes).map((n) => n.kind))]
    .sort()
    .forEach((kind) => option("kind", kind, kind));
  [...new Set(model.edges.map((e) => e.relation))]
    .sort()
    .forEach((relation) => option("relation", relation, relation));
  GDD.communities.forEach((id) => option("community", id, label(id)));
  $("scenario-count").textContent =
    `(${Object.values(model.nodes).filter((n) => n.kind === "scenario").length})`;
  state.scenarios = data.scope.some(
    (id) => model.nodes[id].kind === "scenario",
  );
  $("scenarios").checked = state.scenarios;
  function list() {
    const box = $("object-list");
    box.replaceChildren();
    const objects =
      state.tab === "nodes"
        ? GDD.projection.nodes
        : GDD.projection.edges.map((e) => e.id);
    for (const id of objects) {
      const node = state.tab === "nodes" ? model.nodes[id] : null;
      const edge = node ? null : model.edges.find((e) => e.id === id);
      const item = el("button", undefined, "object-row");
      item.setAttribute("aria-controls", "detail");
      item.setAttribute(
        "aria-pressed",
        state.selected?.type === (node ? "node" : "edge") &&
          state.selected.id === id,
      );
      item.setAttribute(node ? "data-list-node" : "data-list-edge", id);
      const title = el("span", undefined, "row-title"),
        dot = el(
          "span",
          undefined,
          `type-dot type-${node && GDD.kinds.includes(node.kind) ? node.kind : "component"}`,
        );
      title.append(dot, document.createTextNode(node ? label(id) : id));
      const hidden = node && GDD.projection.representatives.get(id) !== id;
      item.append(
        title,
        el(
          "span",
          node
            ? `${node.kind}${hidden ? " · foldet medlem" : ""}`
            : `${edge.from} → ${edge.to} · ${edge.relation}`,
          "row-meta",
        ),
      );
      item.onclick = () => GDD.select(node ? "node" : "edge", id);
      box.append(item);
    }
    if (!objects.length) box.append(el("p", "Ingen match.", "hint"));
    $("tab-nodes").setAttribute("aria-pressed", state.tab === "nodes");
    $("tab-edges").setAttribute("aria-pressed", state.tab === "edges");
  }
  function refresh(reflow = true) {
    GDD.project();
    GDD.layout(reflow);
    GDD.draw();
    list();
    const p = GDD.projection,
      totalNodes = Object.keys(model.nodes).length,
      totalEdges = model.edges.length;
    $("view-count").textContent =
      `${p.nodes.length}/${totalNodes} noder · ${p.edges.length}/${totalEdges} relationer`;
    $("projection-status").textContent = state.fold
      ? `${p.glyphs.length} figurer · ${p.internal.length} foldede interne relationer`
      : `${totalNodes - p.nodes.length} noder og ${totalEdges - p.edges.length} relationer udeladt`;
    $("fold-hint").textContent = state.fold
      ? "Overlap repræsenteres i første synlige community efter ID. Alle medlemskaber kan inspiceres."
      : "Medlemskab er gruppering, ikke ejerskab.";
    $("empty").hidden = Boolean(p.nodes.length);
    GDD.showOverview();
    GDD.fit();
  }
  for (const key of ["search", "kind", "relation", "community"])
    $(key).addEventListener(key === "search" ? "input" : "change", () => {
      state[key] = $(key).value;
      refresh(false);
    });
  $("fold").onchange = () => {
    state.fold = $("fold").checked;
    refresh();
  };
  $("scenarios").onchange = () => {
    state.scenarios = $("scenarios").checked;
    refresh(false);
  };
  $("tab-nodes").onclick = () => {
    state.tab = "nodes";
    list();
  };
  $("tab-edges").onclick = () => {
    state.tab = "edges";
    list();
  };
  $("reset").onclick = () => {
    for (const key of ["search", "kind", "relation", "community"]) {
      state[key] = "";
      $(key).value = "";
    }
    state.fold = false;
    $("fold").checked = false;
    state.scenarios = true;
    $("scenarios").checked = true;
    state.tab = "nodes";
    refresh();
  };
  $("overview").onclick = GDD.showOverview;
  $("manifest-download").onclick = () => {
    const url = URL.createObjectURL(
      new Blob([JSON.stringify(GDD.manifest(), null, 2) + "\n"], {
        type: "application/json",
      }),
    );
    const link = el("a");
    link.href = url;
    link.download = "gdd-view-state.json";
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  window.addEventListener("resize", GDD.fit);
  refresh();
})();
</script>
  </body>
</html>
