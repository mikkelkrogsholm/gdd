format: gdd/0.1
project:
  id: concert-reservations
  title: Concert seat reservations
  status: example_draft
  goal: A user can reserve and cancel a seat without overbooking.
  scope: A modular application and one transactional database; no microservices.
  assumptions:
  - One seat per reservation. Multiple reservations with different request keys are allowed.
  - Concerts already exist, and capacity does not change in this example.
  - Identity comes from the server authentication layer, not a user_id in the request body.
  - Reservations do not expire automatically in this initial model.
  - Payment, ticket issuance, waiting lists and external events are outside this example.
  - Reservation history and successful request keys are retained; deletion is outside this example.
nodes:
  component.api:
    kind: component
    description: Validates transport input and forwards authenticated context.
  component.reservations:
    kind: component
    description: Owns reservation rules, access control and transaction boundaries.
  component.storage:
    kind: component
    description: Database persistence adapter; contains no access-control decisions.
  entity.concert:
    kind: entity
    description: A concert with a fixed nonnegative integer capacity.
    owner: component.reservations
    stored_in: component.storage
    fields:
      id: nonempty_string
      capacity: nonnegative_integer
  entity.reservation:
    kind: entity
    description: One reserved seat with an owner and permanent request key.
    owner: component.reservations
    stored_in: component.storage
    fields:
      id: nonempty_string
      concert_id: nonempty_string
      owner_id: nonempty_string
      request_key: nonempty_string
      state: enum[reserved,cancelled]
  action.reserve:
    kind: action
    description: Reserve exactly one seat or retrieve an earlier successful result.
    owner: component.reservations
    input:
      concert_id: nonempty_string
      request_key: nonempty_string
    context:
      principal_id: server_authenticated_identity
    returns: Reservation ID and current state.
    errors:
    - Unauthenticated
    - InvalidInput
    - ConcertNotFound
    - SoldOut
    - IdempotencyConflict
    specification:
    - Validate identity and input before lookup or mutation.
    - The request key is scoped to principal_id and action.reserve.
    - Bind a successful key to concert_id and reservation ID; reusing the key with another concert_id yields IdempotencyConflict.
    - An identical retry returns the same reservation ID and CURRENT state, including after cancellation, without new side effects.
    - Look up an earlier success BEFORE checking new capacity; a full venue must not turn a successful retry into SoldOut.
    - Only a new key attempts to create a new reservation.
    - Reject a new reservation with SoldOut when the number of reservations in reserved equals capacity.
    - Key uniqueness, capacity protection, creation and key binding must be part of the same atomic database operation or transaction.
    - Concurrent transactions must produce a result equivalent to a valid sequential order under these rules; an unprotected check-then-insert is insufficient.
    - A failed creation does not bind the request key and leaves no reservation.
  action.cancel:
    kind: action
    description: The owner may cancel their reservation; repeating the request has no additional effect.
    owner: component.reservations
    input:
      reservation_id: nonempty_string
    context:
      principal_id: server_authenticated_identity
    returns: Reservation ID and state=cancelled.
    errors:
    - Unauthenticated
    - InvalidInput
    - ReservationNotFound
    specification:
    - Validate identity and input first.
    - An absent reservation and another owner's reservation both yield ReservationNotFound.
    - Check ownership before returning data, including a retry for an already cancelled reservation.
    - Atomically change reserved to cancelled so the reservation no longer occupies a seat.
    - Return cancelled unchanged; do not release a seat again.
    - Preserve the old request key so a repeated reserve request cannot recreate the reservation.
edges:
- id: edge.api_imports_reservations
  from: component.api
  relation: imports
  to: component.reservations
- id: edge.reservations_imports_storage
  from: component.reservations
  relation: imports
  to: component.storage
- id: edge.api_calls_reserve
  from: component.api
  relation: calls
  to: action.reserve
- id: edge.api_calls_cancel
  from: component.api
  relation: calls
  to: action.cancel
machines:
  machine.reservation:
    entity: entity.reservation
    initial: absent
    states:
    - absent
    - reserved
    - cancelled
    terminal:
    - cancelled
    default: reject_unlisted_mutation
    notes:
    - absent is a modeling marker for a reservation that does not yet exist; it is never stored.
    - The state machine describes mutations. Validation, errors and idempotent return paths are defined in the action contracts.
    - cancelled is terminal for mutations but may still be read and returned during an authorized retry.
    transitions:
    - id: transition.reserve
      from: absent
      to: reserved
      trigger: action.reserve
      guard: Authenticated user; existing concert; new request key; at least one available seat.
      effects: Create a reservation with state=reserved and bind the request key atomically under capacity protection.
    - id: transition.cancel
      from: reserved
      to: cancelled
      trigger: action.cancel
      guard: The authenticated user owns the reservation.
      effects: Atomically change to cancelled; any materialized seat counter is updated within the same transaction.
rules:
  rule.capacity:
    kind: invariant
    targets:
    - entity.concert
    - entity.reservation
    statement: For each concert, 0 <= count(reservations with state=reserved) <= capacity after every committed mutation.
    verification: database_concurrency_and_integration_tests
    blocking: true
  rule.idempotency:
    kind: behavior
    targets:
    - action.reserve
    - action.cancel
    statement: Retries must not create extra reservations, reactivate cancelled reservations or release extra seats.
    verification: integration_tests
    blocking: true
  rule.authorization:
    kind: behavior
    targets:
    - action.cancel
    statement: Only the owner may cancel or receive reservation data; the request body must not determine identity.
    verification: authorization_tests
    blocking: true
  rule.atomicity:
    kind: behavior
    targets:
    - action.reserve
    - action.cancel
    statement: Errors before commit leave no partially completed mutation or request-key binding.
    verification: database_fault_injection_tests
    blocking: true
  rule.state_machine:
    kind: behavior
    targets:
    - machine.reservation
    statement: Mutating flows follow the state machine; cancelled reservation IDs cannot be reactivated.
    verification: model_based_and_integration_tests
    blocking: true
  rule.api_boundary:
    kind: architecture
    targets:
    - component.api
    - component.storage
    statement: The API module must not import the persistence module directly.
    constraint:
      relation: imports
      from: component.api
      to: component.storage
      reach: direct
      policy: forbid
    verification: static_import_analysis
    blocking: true
scenarios:
  scenario.reserve:
    verifies:
    - rule.capacity
    - rule.state_machine
    actions:
    - action.reserve
    given: Concert C has capacity=1 and no reservations; user A is authenticated.
    when: A reserves C using key K1.
    then: One reservation ID in reserved for A, and exactly one seat occupied.
  scenario.last_seat:
    verifies:
    - rule.capacity
    actions:
    - action.reserve
    given: Concert C has one available seat; A and B each have a new request key.
    when: Two separate database connections attempt concurrent reservations with controlled overlap.
    then: Exactly one reservation succeeds; the other yields SoldOut; at most one seat is occupied. Run against the selected database's actual transaction behavior.
  scenario.replay:
    verifies:
    - rule.idempotency
    - rule.capacity
    actions:
    - action.reserve
    given: C has capacity=1; A's reserve request with K1 succeeded and took the last seat.
    when: A repeats the same request several times, including concurrently.
    then: The same reservation ID is returned every time; no extra seat is occupied; no SoldOut on a retry.
  scenario.concurrent_same_key:
    verifies:
    - rule.idempotency
    - rule.capacity
    actions:
    - action.reserve
    given: C has capacity=2; A has not yet used K1.
    when: A sends two identical reserve requests with K1 concurrently.
    then: Both return the same reservation ID; exactly one reservation is created.
  scenario.key_conflict:
    verifies:
    - rule.idempotency
    actions:
    - action.reserve
    given: A has reserved concert C1 using K1.
    when: A uses K1 for concert C2.
    then: IdempotencyConflict; no new reservation or capacity change in any concert.
  scenario.cancel:
    verifies:
    - rule.idempotency
    - rule.capacity
    - rule.state_machine
    actions:
    - action.reserve
    - action.cancel
    given: A owns a reserved reservation for a concert with capacity=1.
    when: A cancels twice, including concurrent requests.
    then: Same ID in cancelled; zero active reservations; available seats never exceed capacity.
  scenario.foreign_cancel:
    verifies:
    - rule.authorization
    actions:
    - action.cancel
    given: A owns reservation R; B is authenticated as B.
    when: B attempts to cancel R, including a forged owner_id in the request body. Repeat for both reserved and cancelled states.
    then: ReservationNotFound; no change and no reservation data returned.
  scenario.atomic_failure:
    verifies:
    - rule.atomicity
    actions:
    - action.reserve
    - action.cancel
    given: A valid reserve or cancel flow is ready for mutation.
    when: The test adapter injects failures at relevant persistence boundaries before commit and lets the client retry.
    then: Persistent state is unchanged after the failure; a successful retry applies the effect once. Also verify any counter and key binding.
  scenario.replay_after_cancel:
    verifies:
    - rule.idempotency
    - rule.state_machine
    - rule.capacity
    actions:
    - action.reserve
    - action.cancel
    given: A reserved using K1 and then cancelled reservation R.
    when: A repeats the original reserve request with K1 and then creates a new one with K2.
    then: K1 returns R in cancelled without mutation. K2 may create a new ID if capacity is available; R remains cancelled.
  scenario.api_boundary:
    verifies:
    - rule.api_boundary
    actions: []
    given: Component bindings point to the implemented project's modules.
    when: Extract the import graph; also insert a temporary direct API-to-storage import as a negative control.
    then: The forbidden import must yield FAIL. An absent scan or unresolved mapping yields UNKNOWN, not PASS.
bindings:
  component.api:
    status: planned
    paths:
    - src/api/**
  component.reservations:
    status: planned
    paths:
    - src/reservations/**
  component.storage:
    status: planned
    paths:
    - src/storage/**
verification_policy:
  default_result: UNKNOWN
  results:
  - PASS
  - FAIL
  - UNKNOWN
  require:
  - spec_revision
  - code_revision
  - check_id
  - checker_version
  - scope
  - result
  - evidence_location
  unknown_blocking_rule: block_acceptance
  unlisted_architectural_edge: unspecified_unless_explicit_policy_says_otherwise
  prose_is_executable: false
  structural_validation_is_behavioral_verification: false
