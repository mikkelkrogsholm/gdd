format: gdd/0.2
project:
  id: concert-reservations
  title: Reservation af koncertpladser
  goal: En bruger kan reservere og annullere en plads uden overbooking.
  scope: En modulær applikation og én transaktionel database; ikke mikroservices.
  assumptions:
  - Én plads pr. reservation. Flere reservationer med forskellige request-nøgler er tilladt.
  - Koncerter findes på forhånd, og kapaciteten ændres ikke i dette eksempel.
  - Identitet leveres af serverens autentificeringslag, ikke af et user_id i request-body.
  - Reservationer udløber ikke automatisk i denne første model.
  - Betaling, billetudstedelse, venteliste og eksterne events er uden for dette eksempel.
  - Reservationshistorik og succesfulde request-nøgler bevares; sletning er uden for eksemplet.
nodes:
  component.api:
    kind: component
    description: Validerer transportinput og videresender autentificeret kontekst.
    maturity: specified
    source_refs:
    - source: source.legacy
      purpose: provenance
    interfaces:
    - action.reserve
    - action.cancel
  component.reservations:
    kind: component
    description: Ejer reservationsregler, adgangskontrol og transaktionsgrænser.
    maturity: specified
    source_refs:
    - source: source.legacy
      purpose: provenance
    interfaces:
    - action.reserve
    - action.cancel
  component.storage:
    kind: component
    description: Persistence-adapter til databasen; indeholder ikke beslutninger om adgangsrettigheder.
    maturity: specified
    source_refs:
    - source: source.legacy
      purpose: provenance
    interfaces: []
  entity.concert:
    kind: entity
    description: En koncert med en fast, ikke-negativ heltalskapacitet.
    maturity: specified
    source_refs:
    - source: source.legacy
      purpose: provenance
    fields:
      id:
        type: string
        min_length: 1
      capacity:
        type: integer
        minimum: 0
  entity.reservation:
    kind: entity
    description: Én reserveret plads med ejer og permanent request-nøgle.
    maturity: specified
    source_refs:
    - source: source.legacy
      purpose: provenance
    fields:
      id:
        type: string
        min_length: 1
      concert_id:
        type: string
        min_length: 1
      owner_id:
        type: string
        min_length: 1
      request_key:
        type: string
        min_length: 1
      state:
        type: enum
        values:
        - reserved
        - cancelled
  action.reserve:
    kind: action
    description: Reservér præcis én plads eller genfind resultatet af en tidligere succes.
    maturity: specified
    source_refs:
    - source: source.legacy
      purpose: provenance
    contract:
      input:
        concert_id:
          type: string
          min_length: 1
        request_key:
          type: string
          min_length: 1
      context:
        principal_id:
          type: string
          min_length: 1
          origin: authenticated_context
      output:
        type: object
        properties:
          id:
            type: string
            min_length: 1
          state:
            type: enum
            values:
            - reserved
            - cancelled
        required:
        - id
        - state
      errors:
        Unauthenticated: Unauthenticated
        InvalidInput: InvalidInput
        ConcertNotFound: ConcertNotFound
        SoldOut: SoldOut
        IdempotencyConflict: IdempotencyConflict
      preconditions:
      - Valider autentificeret identitet og input før opslag eller mutation.
      external_effects: []
      effects_complete: true
      dependencies_complete: true
      risks:
        authorization:
          relevant: true
          rationale: Kontrakten omfatter denne risiko; scenarierne er planlagte checks.
          scenarios:
          - scenario.reserve_unauthenticated
        idempotency:
          relevant: true
          rationale: Kontrakten omfatter denne risiko; scenarierne er planlagte checks.
          scenarios:
          - scenario.replay
          - scenario.key_conflict
        boundaries:
          relevant: true
          rationale: Kontrakten omfatter denne risiko; scenarierne er planlagte checks.
          scenarios:
          - scenario.zero_capacity
          - scenario.sold_out
        concurrency:
          relevant: true
          rationale: Kontrakten omfatter denne risiko; scenarierne er planlagte checks.
          scenarios:
          - scenario.last_seat
          - scenario.concurrent_same_key
        atomicity:
          relevant: true
          rationale: Kontrakten omfatter denne risiko; scenarierne er planlagte checks.
          scenarios:
          - scenario.atomic_failure
      error_cases:
        Unauthenticated:
        - scenario.reserve_unauthenticated
        InvalidInput:
        - scenario.reserve_invalid
        ConcertNotFound:
        - scenario.concert_missing
        SoldOut:
        - scenario.sold_out
        IdempotencyConflict:
        - scenario.key_conflict
    behavior: 'Valider identitet og input før opslag eller mutation.

      Request-nøglen er scoped til principal_id og action.reserve.

      Bind en succesfuld nøgle til concert_id og reservations-id; samme nøgle med andet concert_id giver IdempotencyConflict.

      En identisk gentagelse returnerer samme reservations-id og AKTUEL tilstand, også efter annullering, uden
      nye sideeffekter.

      Slå en tidligere succes op FØR en ny kapacitetskontrol; et fuldt spillested må ikke gøre en succesfuld
      gentagelse til SoldOut.

      Kun en ny nøgle forsøger at oprette en ny reservation.

      Afvis en ny reservation med SoldOut, når antallet af reservationer i reserved er lig kapaciteten.

      Nøgleunikhed, kapacitetsbeskyttelse, oprettelse og nøglebinding skal indgå i samme atomare databaseoperation
      eller transaktion.

      Samtidige transaktioner skal give et resultat svarende til en gyldig sekventiel rækkefølge for disse
      regler; en check-then-insert uden beskyttelse er ikke nok.

      En mislykket oprettelse binder ikke request-nøglen og efterlader ingen reservation.'
  action.cancel:
    kind: action
    description: Ejeren kan annullere sin reservation; gentagelse er uden ekstra effekt.
    maturity: specified
    source_refs:
    - source: source.legacy
      purpose: provenance
    contract:
      input:
        reservation_id:
          type: string
          min_length: 1
      context:
        principal_id:
          type: string
          min_length: 1
          origin: authenticated_context
      output:
        type: object
        properties:
          id:
            type: string
            min_length: 1
          state:
            type: enum
            values:
            - cancelled
        required:
        - id
        - state
      errors:
        Unauthenticated: Unauthenticated
        InvalidInput: InvalidInput
        ReservationNotFound: ReservationNotFound
      preconditions:
      - Valider autentificeret identitet og input før opslag eller mutation.
      external_effects: []
      effects_complete: true
      dependencies_complete: true
      risks:
        authorization:
          relevant: true
          rationale: Kontrakten omfatter denne risiko; scenarierne er planlagte checks.
          scenarios:
          - scenario.foreign_cancel
        idempotency:
          relevant: true
          rationale: Kontrakten omfatter denne risiko; scenarierne er planlagte checks.
          scenarios:
          - scenario.cancel
          - scenario.replay_after_cancel
        boundaries:
          relevant: true
          rationale: Kontrakten omfatter denne risiko; scenarierne er planlagte checks.
          scenarios:
          - scenario.reservation_missing
        concurrency:
          relevant: true
          rationale: Kontrakten omfatter denne risiko; scenarierne er planlagte checks.
          scenarios:
          - scenario.cancel_concurrent
        atomicity:
          relevant: true
          rationale: Kontrakten omfatter denne risiko; scenarierne er planlagte checks.
          scenarios:
          - scenario.atomic_failure
      error_cases:
        Unauthenticated:
        - scenario.cancel_unauthenticated
        InvalidInput:
        - scenario.cancel_invalid
        ReservationNotFound:
        - scenario.reservation_missing
        - scenario.foreign_cancel
    behavior: 'Valider identitet og input først.

      Manglende reservation og en anden ejers reservation giver begge ReservationNotFound.

      Kontrollér ejerskab før retur af data, også ved gentagelse på en allerede annulleret reservation.

      reserved ændres atomart til cancelled, så reservationen ikke længere optager en plads.

      cancelled returneres uændret; frigiv ikke en plads igen.

      Den gamle request-nøgle bevares, så en gentaget reserve-request ikke genopretter reservationen.'
  rule.capacity:
    kind: rule
    description: For hver koncert er 0 <= count(reservationer med state=reserved) <= capacity efter hver committed
      mutation.
    maturity: specified
    rule:
      category: invariant
      statement: For hver koncert er 0 <= count(reservationer med state=reserved) <= capacity efter hver committed
        mutation.
      scope: targeted
      blocking: true
      verification:
      - database_concurrency_and_integration_tests
  rule.idempotency:
    kind: rule
    description: Gentagelser må ikke oprette ekstra reservationer, genaktivere annullerede reservationer eller
      frigive ekstra pladser.
    maturity: specified
    rule:
      category: behavior
      statement: Gentagelser må ikke oprette ekstra reservationer, genaktivere annullerede reservationer eller
        frigive ekstra pladser.
      scope: targeted
      blocking: true
      verification:
      - integration_tests
  rule.authorization:
    kind: rule
    description: Kun ejeren må annullere eller få reservationsdata retur; en request-body må ikke fastlægge
      identiteten.
    maturity: specified
    rule:
      category: behavior
      statement: Kun ejeren må annullere eller få reservationsdata retur; en request-body må ikke fastlægge
        identiteten.
      scope: targeted
      blocking: true
      verification:
      - authorization_tests
  rule.atomicity:
    kind: rule
    description: Fejl før commit efterlader ingen delvist gennemført mutation eller request-nøglebinding.
    maturity: specified
    rule:
      category: behavior
      statement: Fejl før commit efterlader ingen delvist gennemført mutation eller request-nøglebinding.
      scope: targeted
      blocking: true
      verification:
      - database_fault_injection_tests
  rule.state_machine:
    kind: rule
    description: Muterende forløb følger tilstandsmaskinen; annullerede reservations-id'er kan ikke genaktiveres.
    maturity: specified
    rule:
      category: behavior
      statement: Muterende forløb følger tilstandsmaskinen; annullerede reservations-id'er kan ikke genaktiveres.
      scope: targeted
      blocking: true
      verification:
      - model_based_and_integration_tests
  rule.api_boundary:
    kind: rule
    description: API-modulet må ikke importere persistence-modulet direkte.
    maturity: specified
    rule:
      category: architecture
      statement: API-modulet må ikke importere persistence-modulet direkte.
      scope: targeted
      blocking: true
      verification:
      - static_import_analysis
      constraint:
        relation: imports
        from: component.api
        to: component.storage
        reach: direct
        policy: forbid
  machine.reservation:
    kind: machine
    description: Reservations mutationslivscyklus; retries og fejl følger action-kontrakterne.
    maturity: specified
    machine:
      states:
      - absent
      - reserved
      - cancelled
      initial: absent
      terminal:
      - cancelled
      transitions:
      - id: transition.reserve
        from: absent
        to: reserved
        trigger: action.reserve
        guard: Autentificeret bruger; eksisterende koncert; ny request-nøgle; mindst én ledig plads.
        effects: Opret reservation med state=reserved og bind request-nøglen atomart under kapacitetsbeskyttelsen.
      - id: transition.cancel
        from: reserved
        to: cancelled
        trigger: action.cancel
        guard: Den autentificerede bruger ejer reservationen.
        effects: Skift atomart til cancelled; en eventuel materialiseret pladstæller opdateres i samme transaktion.
    annotations:
      gdd.notes:
      - absent er en modelleringsmarkør for en reservation, der endnu ikke eksisterer; den lagres aldrig.
      - Tilstandsmaskinen beskriver mutationer. Validering, fejl og idempotente returveje er defineret i action-kontrakterne.
      - cancelled er terminal for mutationer, men må fortsat læses og returneres ved en autoriseret gentagelse.
  scenario.reserve:
    kind: scenario
    description: Ét reservations-id i reserved til A, og præcis én plads optaget.
    scenario:
      category: normal
      given: Koncert C har capacity=1 og ingen reservationer; bruger A er autentificeret.
      when: A reserverer C med nøgle K1.
      then: Ét reservations-id i reserved til A, og præcis én plads optaget.
  scenario.last_seat:
    kind: scenario
    description: Præcis én reservation lykkes; den anden giver SoldOut; højst én plads er optaget. Kør mod
      den valgte databases reelle transaktionsadfærd.
    scenario:
      category: concurrency
      given: Koncert C har én ledig plads; A og B har hver sin nye request-nøgle.
      when: To separate databaseforbindelser forsøger at reservere samtidigt med kontrolleret overlap.
      then: Præcis én reservation lykkes; den anden giver SoldOut; højst én plads er optaget. Kør mod den valgte
        databases reelle transaktionsadfærd.
  scenario.replay:
    kind: scenario
    description: Samme reservations-id returneres hver gang; ingen ekstra plads optages; ingen SoldOut på gentagelsen.
    scenario:
      category: boundary
      given: C har capacity=1; A's reserve med K1 er lykkedes og har optaget den sidste plads.
      when: A gentager samme request flere gange, også samtidigt.
      then: Samme reservations-id returneres hver gang; ingen ekstra plads optages; ingen SoldOut på gentagelsen.
  scenario.concurrent_same_key:
    kind: scenario
    description: Begge returnerer samme reservations-id; præcis én reservation oprettes.
    scenario:
      category: concurrency
      given: C har capacity=2; K1 er endnu ikke brugt af A.
      when: A sender to identiske reserve-requests med K1 samtidigt.
      then: Begge returnerer samme reservations-id; præcis én reservation oprettes.
  scenario.key_conflict:
    kind: scenario
    description: IdempotencyConflict; ingen ny reservation eller kapacitetsændring i nogen koncert.
    scenario:
      category: negative
      given: A har med K1 reserveret koncert C1.
      when: A bruger K1 til koncert C2.
      then: IdempotencyConflict; ingen ny reservation eller kapacitetsændring i nogen koncert.
  scenario.cancel:
    kind: scenario
    description: Samme id i cancelled; nul aktive reservationer; aldrig flere ledige pladser end capacity.
    scenario:
      category: boundary
      given: A ejer en reserved reservation i en koncert med capacity=1.
      when: A annullerer to gange, også med samtidige requests.
      then: Samme id i cancelled; nul aktive reservationer; aldrig flere ledige pladser end capacity.
  scenario.foreign_cancel:
    kind: scenario
    description: ReservationNotFound; ingen ændring og ingen reservationsdata returneres.
    scenario:
      category: negative
      given: A ejer reservation R; B er autentificeret som B.
      when: B forsøger at annullere R, også med et forfalsket owner_id i request-body. Gentag både når R er
        reserved og cancelled.
      then: ReservationNotFound; ingen ændring og ingen reservationsdata returneres.
  scenario.atomic_failure:
    kind: scenario
    description: Efter fejlen er vedvarende tilstand uændret; efter vellykket genforsøg er effekten udført
      én gang. Kontrollér også evt. tæller og nøglebinding.
    scenario:
      category: negative
      given: Et gyldigt reserve- eller cancel-forløb er klar til mutation.
      when: Testadapteren injicerer fejl ved relevante persistensgrænser før commit og lader klienten genforsøge.
      then: Efter fejlen er vedvarende tilstand uændret; efter vellykket genforsøg er effekten udført én gang.
        Kontrollér også evt. tæller og nøglebinding.
  scenario.replay_after_cancel:
    kind: scenario
    description: K1 returnerer R i cancelled uden mutation. K2 kan oprette et nyt id, hvis der er plads; R
      forbliver cancelled.
    scenario:
      category: boundary
      given: A har reserveret med K1 og derefter annulleret reservation R.
      when: A gentager den oprindelige reserve-request med K1 og opretter derefter en ny med K2.
      then: K1 returnerer R i cancelled uden mutation. K2 kan oprette et nyt id, hvis der er plads; R forbliver
        cancelled.
  scenario.api_boundary:
    kind: scenario
    description: Den forbudte import skal give FAIL. En manglende scanning eller uafklaret mapping giver UNKNOWN,
      ikke PASS.
    scenario:
      category: architecture
      given: Komponenternes bindings peger på det implementerede projekts moduler.
      when: Importgrafen udtrækkes; indsæt desuden en midlertidig direkte API-til-storage-import som negativ
        kontrol.
      then: Den forbudte import skal give FAIL. En manglende scanning eller uafklaret mapping giver UNKNOWN,
        ikke PASS.
  scenario.reserve_unauthenticated:
    kind: scenario
    description: Unauthenticated; ingen opslag eller mutation.
    scenario:
      category: negative
      given: Ingen serverautentificeret principal.
      when: Reserve kaldes med ellers gyldigt input.
      then: Unauthenticated; ingen opslag eller mutation.
  scenario.reserve_invalid:
    kind: scenario
    description: InvalidInput; ingen mutation.
    scenario:
      category: negative
      given: Autentificeret bruger; tomt concert_id eller request_key.
      when: Reserve kaldes.
      then: InvalidInput; ingen mutation.
  scenario.concert_missing:
    kind: scenario
    description: ConcertNotFound; nøglen bindes ikke.
    scenario:
      category: negative
      given: Autentificeret bruger; ny nøgle; koncert findes ikke.
      when: Reserve kaldes.
      then: ConcertNotFound; nøglen bindes ikke.
  scenario.sold_out:
    kind: scenario
    description: SoldOut; ingen mutation eller nøglebinding.
    scenario:
      category: negative
      given: Koncerten er fuld; bruger har en ny nøgle.
      when: Reserve kaldes.
      then: SoldOut; ingen mutation eller nøglebinding.
  scenario.zero_capacity:
    kind: scenario
    description: SoldOut; nul aktive reservationer.
    scenario:
      category: boundary
      given: Koncert har capacity=0.
      when: En gyldig ny reservation forsøges.
      then: SoldOut; nul aktive reservationer.
  scenario.cancel_once:
    kind: scenario
    description: Samme id returneres cancelled; én plads frigives.
    scenario:
      category: normal
      given: A ejer en reserved reservation.
      when: A annullerer én gang.
      then: Samme id returneres cancelled; én plads frigives.
  scenario.cancel_concurrent:
    kind: scenario
    description: Begge returnerer samme cancelled id; pladsen frigives kun én gang.
    scenario:
      category: concurrency
      given: A ejer én reserved reservation.
      when: To forbindelser annullerer samtidigt.
      then: Begge returnerer samme cancelled id; pladsen frigives kun én gang.
  scenario.cancel_unauthenticated:
    kind: scenario
    description: Unauthenticated; ingen opslag eller mutation.
    scenario:
      category: negative
      given: Ingen serverautentificeret principal.
      when: Cancel kaldes.
      then: Unauthenticated; ingen opslag eller mutation.
  scenario.cancel_invalid:
    kind: scenario
    description: InvalidInput; ingen mutation.
    scenario:
      category: negative
      given: Autentificeret bruger; tomt reservation_id.
      when: Cancel kaldes.
      then: InvalidInput; ingen mutation.
  scenario.reservation_missing:
    kind: scenario
    description: ReservationNotFound uden reservationsdata.
    scenario:
      category: negative
      given: Autentificeret bruger; reservation findes ikke.
      when: Cancel kaldes.
      then: ReservationNotFound uden reservationsdata.
  component.frontend:
    kind: component
    description: Planlagt brugerflade; skitse uden teknologistak.
    maturity: sketch
  screen.reserve:
    kind: screen
    description: Planlagt reservationsskærm; interaktion og design mangler stadig.
    maturity: sketch
    design_refs:
    - source: source.design
      purpose: contract
      selector:
        kind: whole-document
  community.backend:
    kind: community
    description: Backend-visning af den fælles model.
  community.frontend:
    kind: community
    description: Frontend-visning af den fælles model.
