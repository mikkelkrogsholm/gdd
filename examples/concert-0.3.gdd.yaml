format: gdd/0.3
project:
  id: concert-reservations
  title: Concert seat reservations
  goal: A user can reserve and cancel a seat without overbooking.
  scope: A modular application and one transactional database; no microservices.
  assumptions:
  - One seat per reservation. Multiple reservations with different request keys are allowed.
  - Concerts already exist, and capacity does not change in this example.
  - Identity comes from the server authentication layer, not a user_id in the request body.
  - Reservations do not expire automatically in this initial model.
  - Payment, ticket issuance, waiting lists and external events are outside this example.
  - Reservation history and successful request keys are retained; deletion is outside this example.
nodes:
  component.api:
    kind: component
    description: Validates transport input and forwards authenticated context.
    maturity: specified
    source_refs:
    - source: source.legacy
      purpose: provenance
    interfaces: []
    boundary:
      responsibility: Translate transport requests and forward trusted authentication context.
      rationale: Keep transport changes separate from reservation and persistence decisions.
      excludes:
      - Seat allocation and reservation lifecycle decisions.
      - Physical persistence operations.
  component.reservations:
    kind: component
    description: Owns reservation rules, access control and transaction boundaries.
    maturity: specified
    source_refs:
    - source: source.legacy
      purpose: provenance
    interfaces:
    - action.reserve
    - action.cancel
    boundary:
      responsibility: Own reservation rules, access control and transaction decisions.
      rationale: Keep availability, atomicity and cancellation rules consistent behind one public interface.
      excludes:
      - Transport request/response translation.
      - Physical storage implementation.
  component.storage:
    kind: component
    description: Database persistence adapter; contains no access-control decisions.
    maturity: specified
    source_refs:
    - source: source.legacy
      purpose: provenance
    interfaces: []
    boundary:
      responsibility: Implement persistence and transactions selected by the reservation component.
      rationale: Isolate database-specific behavior behind the domain persistence boundary.
      excludes:
      - Authentication and reservation policy decisions.
  entity.concert:
    kind: entity
    description: A concert with a fixed nonnegative integer capacity.
    maturity: specified
    source_refs:
    - source: source.legacy
      purpose: provenance
    fields:
      id:
        type: string
        min_length: 1
      capacity:
        type: integer
        minimum: 0
  entity.reservation:
    kind: entity
    description: One reserved seat with an owner and permanent request key.
    maturity: specified
    source_refs:
    - source: source.legacy
      purpose: provenance
    fields:
      id:
        type: string
        min_length: 1
      concert_id:
        type: string
        min_length: 1
      owner_id:
        type: string
        min_length: 1
      request_key:
        type: string
        min_length: 1
      state:
        type: enum
        values:
        - reserved
        - cancelled
  action.reserve:
    kind: action
    description: Reserve exactly one seat or retrieve an earlier successful result.
    maturity: specified
    source_refs:
    - source: source.legacy
      purpose: provenance
    contract:
      input:
        concert_id:
          type: string
          min_length: 1
        request_key:
          type: string
          min_length: 1
      context:
        principal_id:
          type: string
          min_length: 1
          origin: authenticated_context
      output:
        type: object
        properties:
          id:
            type: string
            min_length: 1
          state:
            type: enum
            values:
            - reserved
            - cancelled
        required:
        - id
        - state
      errors:
        Unauthenticated: Reject before lookup or mutation when trusted authentication is absent.
        InvalidInput: Reject malformed input before any reservation mutation.
        ConcertNotFound: Return an error and create no reservation when the concert does not exist.
        SoldOut: Return an error and create no reservation when no seat is available.
        IdempotencyConflict: Reject a request key already bound to another concert; leave the existing
          reservation unchanged.
      preconditions:
      - Validate authenticated identity and input before lookup or mutation.
      external_effects: []
      effects_complete: true
      dependencies_complete: true
      risks:
        authorization:
          relevant: true
          rationale: The contract covers this risk; the scenarios are planned checks.
          scenarios:
          - scenario.reserve_unauthenticated
        idempotency:
          relevant: true
          rationale: The contract covers this risk; the scenarios are planned checks.
          scenarios:
          - scenario.replay
          - scenario.key_conflict
        boundaries:
          relevant: true
          rationale: The contract covers this risk; the scenarios are planned checks.
          scenarios:
          - scenario.zero_capacity
          - scenario.sold_out
        concurrency:
          relevant: true
          rationale: The contract covers this risk; the scenarios are planned checks.
          scenarios:
          - scenario.last_seat
          - scenario.concurrent_same_key
        atomicity:
          relevant: true
          rationale: The contract covers this risk; the scenarios are planned checks.
          scenarios:
          - scenario.atomic_failure
      error_cases:
        Unauthenticated:
        - scenario.reserve_unauthenticated
        InvalidInput:
        - scenario.reserve_invalid
        ConcertNotFound:
        - scenario.concert_missing
        SoldOut:
        - scenario.sold_out
        IdempotencyConflict:
        - scenario.key_conflict
      postconditions:
      - A new reservation is created atomically only when capacity is available.
      - A successful repeated request returns its original reservation in its current state and creates
        no additional reservation.
    behavior: 'Validate identity and input before lookup or mutation.

      The request key is scoped to principal_id and action.reserve.

      Bind a successful key to concert_id and reservation ID; reusing the key with another concert_id
      yields IdempotencyConflict.

      An identical retry returns the same reservation ID and CURRENT state, including after cancellation,
      without new side effects.

      Look up an earlier success BEFORE checking new capacity; a full venue must not turn a successful
      retry into SoldOut.

      Only a new key attempts to create a new reservation.

      Reject a new reservation with SoldOut when the number of reservations in reserved equals capacity.

      Key uniqueness, capacity protection, creation and key binding must be part of the same atomic database
      operation or transaction.

      Concurrent transactions must produce a result equivalent to a valid sequential order under these
      rules; an unprotected check-then-insert is insufficient.

      A failed creation does not bind the request key and leaves no reservation.'
  action.cancel:
    kind: action
    description: The owner may cancel their reservation; repeating the request has no additional effect.
    maturity: specified
    source_refs:
    - source: source.legacy
      purpose: provenance
    contract:
      input:
        reservation_id:
          type: string
          min_length: 1
      context:
        principal_id:
          type: string
          min_length: 1
          origin: authenticated_context
      output:
        type: object
        properties:
          id:
            type: string
            min_length: 1
          state:
            type: enum
            values:
            - cancelled
        required:
        - id
        - state
      errors:
        Unauthenticated: Reject before lookup or mutation when trusted authentication is absent.
        InvalidInput: Reject malformed input before any reservation mutation.
        ReservationNotFound: Return an error when the reservation does not exist; change no reservation.
      preconditions:
      - Validate authenticated identity and input before lookup or mutation.
      external_effects: []
      effects_complete: true
      dependencies_complete: true
      risks:
        authorization:
          relevant: true
          rationale: The contract covers this risk; the scenarios are planned checks.
          scenarios:
          - scenario.foreign_cancel
        idempotency:
          relevant: true
          rationale: The contract covers this risk; the scenarios are planned checks.
          scenarios:
          - scenario.cancel
          - scenario.replay_after_cancel
        boundaries:
          relevant: true
          rationale: The contract covers this risk; the scenarios are planned checks.
          scenarios:
          - scenario.reservation_missing
        concurrency:
          relevant: true
          rationale: The contract covers this risk; the scenarios are planned checks.
          scenarios:
          - scenario.cancel_concurrent
        atomicity:
          relevant: true
          rationale: The contract covers this risk; the scenarios are planned checks.
          scenarios:
          - scenario.atomic_failure
      error_cases:
        Unauthenticated:
        - scenario.cancel_unauthenticated
        InvalidInput:
        - scenario.cancel_invalid
        ReservationNotFound:
        - scenario.reservation_missing
        - scenario.foreign_cancel
      postconditions:
      - An owned active reservation becomes cancelled atomically.
      - An already cancelled owned reservation remains cancelled.
    behavior: 'Validate identity and input first.

      An absent reservation and another owner''s reservation both yield ReservationNotFound.

      Check ownership before returning data, including a retry for an already cancelled reservation.

      Atomically change reserved to cancelled so the reservation no longer occupies a seat.

      Return cancelled unchanged; do not release a seat again.

      Preserve the old request key so a repeated reserve request cannot recreate the reservation.'
  rule.capacity:
    kind: rule
    description: For each concert, 0 <= count(reservations with state=reserved) <= capacity after every
      committed mutation.
    maturity: specified
    rule:
      category: invariant
      statement: For each concert, 0 <= count(reservations with state=reserved) <= capacity after every
        committed mutation.
      scope: targeted
      blocking: true
      verification:
      - database_concurrency_and_integration_tests
  rule.idempotency:
    kind: rule
    description: Retries must not create extra reservations, reactivate cancelled reservations or release
      extra seats.
    maturity: specified
    rule:
      category: behavior
      statement: Retries must not create extra reservations, reactivate cancelled reservations or release
        extra seats.
      scope: targeted
      blocking: true
      verification:
      - integration_tests
  rule.authorization:
    kind: rule
    description: Only the owner may cancel or receive reservation data; the request body must not determine
      identity.
    maturity: specified
    rule:
      category: behavior
      statement: Only the owner may cancel or receive reservation data; the request body must not determine
        identity.
      scope: targeted
      blocking: true
      verification:
      - authorization_tests
  rule.atomicity:
    kind: rule
    description: Errors before commit leave no partially completed mutation or request-key binding.
    maturity: specified
    rule:
      category: behavior
      statement: Errors before commit leave no partially completed mutation or request-key binding.
      scope: targeted
      blocking: true
      verification:
      - database_fault_injection_tests
  rule.state_machine:
    kind: rule
    description: Mutating flows follow the state machine; cancelled reservation IDs cannot be reactivated.
    maturity: specified
    rule:
      category: behavior
      statement: Mutating flows follow the state machine; cancelled reservation IDs cannot be reactivated.
      scope: targeted
      blocking: true
      verification:
      - model_based_and_integration_tests
  rule.api_boundary:
    kind: rule
    description: The API module must not import the persistence module directly.
    maturity: specified
    rule:
      category: architecture
      statement: The API module must not import the persistence module directly.
      scope: targeted
      blocking: true
      verification:
      - static_import_analysis
      constraint:
        relation: imports
        from: component.api
        to: component.storage
        reach: direct
        policy: forbid
  machine.reservation:
    kind: machine
    description: Reservation mutation lifecycle; retries and errors follow the action contracts.
    maturity: specified
    machine:
      states:
      - absent
      - reserved
      - cancelled
      initial: absent
      terminal:
      - cancelled
      transitions:
      - id: transition.reserve
        from: absent
        to: reserved
        trigger: action.reserve
        guard: Authenticated user; existing concert; new request key; at least one available seat.
        effects: Create a reservation with state=reserved and bind the request key atomically under capacity
          protection.
      - id: transition.cancel
        from: reserved
        to: cancelled
        trigger: action.cancel
        guard: The authenticated user owns the reservation.
        effects: Atomically change to cancelled; any materialized seat counter is updated within the same
          transaction.
    annotations:
      gdd.notes:
      - absent is a modeling marker for a reservation that does not yet exist; it is never stored.
      - The state machine describes mutations. Validation, errors and idempotent return paths are defined
        in the action contracts.
      - cancelled is terminal for mutations but may still be read and returned during an authorized retry.
  scenario.reserve:
    kind: scenario
    description: One reservation ID in reserved for A, and exactly one seat occupied.
    scenario:
      category: normal
      given: Concert C has capacity=1 and no reservations; user A is authenticated.
      when: A reserves C using key K1.
      then: One reservation ID in reserved for A, and exactly one seat occupied.
  scenario.last_seat:
    kind: scenario
    description: Exactly one reservation succeeds; the other yields SoldOut; at most one seat is occupied.
      Run against the selected database's actual transaction behavior.
    scenario:
      category: concurrency
      given: Concert C has one available seat; A and B each have a new request key.
      when: Two separate database connections attempt concurrent reservations with controlled overlap.
      then: Exactly one reservation succeeds; the other yields SoldOut; at most one seat is occupied.
        Run against the selected database's actual transaction behavior.
  scenario.replay:
    kind: scenario
    description: The same reservation ID is returned every time; no extra seat is occupied; no SoldOut
      on a retry.
    scenario:
      category: boundary
      given: C has capacity=1; A's reserve request with K1 succeeded and took the last seat.
      when: A repeats the same request several times, including concurrently.
      then: The same reservation ID is returned every time; no extra seat is occupied; no SoldOut on a
        retry.
  scenario.concurrent_same_key:
    kind: scenario
    description: Both return the same reservation ID; exactly one reservation is created.
    scenario:
      category: concurrency
      given: C has capacity=2; A has not yet used K1.
      when: A sends two identical reserve requests with K1 concurrently.
      then: Both return the same reservation ID; exactly one reservation is created.
  scenario.key_conflict:
    kind: scenario
    description: IdempotencyConflict; no new reservation or capacity change in any concert.
    scenario:
      category: negative
      given: A has reserved concert C1 using K1.
      when: A uses K1 for concert C2.
      then: IdempotencyConflict; no new reservation or capacity change in any concert.
  scenario.cancel:
    kind: scenario
    description: Same ID in cancelled; zero active reservations; available seats never exceed capacity.
    scenario:
      category: boundary
      given: A owns a reserved reservation for a concert with capacity=1.
      when: A cancels twice, including concurrent requests.
      then: Same ID in cancelled; zero active reservations; available seats never exceed capacity.
  scenario.foreign_cancel:
    kind: scenario
    description: ReservationNotFound; no change and no reservation data returned.
    scenario:
      category: negative
      given: A owns reservation R; B is authenticated as B.
      when: B attempts to cancel R, including a forged owner_id in the request body. Repeat for both reserved
        and cancelled states.
      then: ReservationNotFound; no change and no reservation data returned.
  scenario.atomic_failure:
    kind: scenario
    description: Persistent state is unchanged after the failure; a successful retry applies the effect
      once. Also verify any counter and key binding.
    scenario:
      category: negative
      given: A valid reserve or cancel flow is ready for mutation.
      when: The test adapter injects failures at relevant persistence boundaries before commit and lets
        the client retry.
      then: Persistent state is unchanged after the failure; a successful retry applies the effect once.
        Also verify any counter and key binding.
  scenario.replay_after_cancel:
    kind: scenario
    description: K1 returns R in cancelled without mutation. K2 may create a new ID if capacity is available;
      R remains cancelled.
    scenario:
      category: boundary
      given: A reserved using K1 and then cancelled reservation R.
      when: A repeats the original reserve request with K1 and then creates a new one with K2.
      then: K1 returns R in cancelled without mutation. K2 may create a new ID if capacity is available;
        R remains cancelled.
  scenario.api_boundary:
    kind: scenario
    description: The forbidden import must yield FAIL. An absent scan or unresolved mapping yields UNKNOWN,
      not PASS.
    scenario:
      category: architecture
      given: Component bindings point to the implemented project's modules.
      when: Extract the import graph; also insert a temporary direct API-to-storage import as a negative
        control.
      then: The forbidden import must yield FAIL. An absent scan or unresolved mapping yields UNKNOWN,
        not PASS.
  scenario.reserve_unauthenticated:
    kind: scenario
    description: Unauthenticated; no lookup or mutation.
    scenario:
      category: negative
      given: No server-authenticated principal.
      when: Reserve is called with otherwise valid input.
      then: Unauthenticated; no lookup or mutation.
  scenario.reserve_invalid:
    kind: scenario
    description: InvalidInput; no mutation.
    scenario:
      category: negative
      given: Authenticated user; empty concert_id or request_key.
      when: Reserve kaldes.
      then: InvalidInput; no mutation.
  scenario.concert_missing:
    kind: scenario
    description: ConcertNotFound; the key is not bound.
    scenario:
      category: negative
      given: Authenticated user; new key; concert does not exist.
      when: Reserve kaldes.
      then: ConcertNotFound; the key is not bound.
  scenario.sold_out:
    kind: scenario
    description: SoldOut; no mutation or key binding.
    scenario:
      category: negative
      given: The concert is full; the user has a new key.
      when: Reserve kaldes.
      then: SoldOut; no mutation or key binding.
  scenario.zero_capacity:
    kind: scenario
    description: SoldOut; zero active reservations.
    scenario:
      category: boundary
      given: The concert has capacity=0.
      when: A valid new reservation is attempted.
      then: SoldOut; zero active reservations.
  scenario.cancel_once:
    kind: scenario
    description: The same ID is returned as cancelled; one seat is released.
    scenario:
      category: normal
      given: A owns a reserved reservation.
      when: A cancels once.
      then: The same ID is returned as cancelled; one seat is released.
  scenario.cancel_concurrent:
    kind: scenario
    description: Both return the same cancelled ID; the seat is released only once.
    scenario:
      category: concurrency
      given: A ejer én reserved reservation.
      when: Two connections cancel concurrently.
      then: Both return the same cancelled ID; the seat is released only once.
  scenario.cancel_unauthenticated:
    kind: scenario
    description: Unauthenticated; no lookup or mutation.
    scenario:
      category: negative
      given: No server-authenticated principal.
      when: Cancel kaldes.
      then: Unauthenticated; no lookup or mutation.
  scenario.cancel_invalid:
    kind: scenario
    description: InvalidInput; no mutation.
    scenario:
      category: negative
      given: Authenticated user; empty reservation_id.
      when: Cancel kaldes.
      then: InvalidInput; no mutation.
  scenario.reservation_missing:
    kind: scenario
    description: ReservationNotFound without reservation data.
    scenario:
      category: negative
      given: Authenticated user; reservation does not exist.
      when: Cancel kaldes.
      then: ReservationNotFound without reservation data.
  component.frontend:
    kind: component
    description: Planned interface; a sketch without a technology stack.
    maturity: sketch
    boundary:
      responsibility: Present reservation interactions and their user-visible states.
      rationale: Let presentation change while preserving the reservation operation contracts.
      excludes:
      - Authoritative seat allocation and access-control decisions.
    interfaces: []
  screen.reserve:
    kind: screen
    description: Planned reservation screen; interaction and design are still missing.
    maturity: sketch
    design_refs:
    - source: source.design
      purpose: contract
      selector:
        kind: whole-document
  community.backend:
    kind: community
    description: Backend view of the shared model.
  community.frontend:
    kind: community
    description: Frontend view of the shared model.
  rule.design.kiss:
    kind: rule
    description: Each layer and abstraction serves a current requirement; prefer the smallest clear implementation.
    rule:
      category: design
      principle: kiss
      statement: Each layer and abstraction serves a current requirement; prefer the smallest clear implementation.
      scope: global
      blocking: false
      verification:
      - design_review
  rule.design.dry:
    kind: rule
    description: Reservation and cancellation reuse one authoritative definition of each business rule;
      similar code alone does not require abstraction.
    rule:
      category: design
      principle: dry
      statement: Reservation and cancellation reuse one authoritative definition of each business rule;
        similar code alone does not require abstraction.
      scope: global
      blocking: false
      verification:
      - design_review
  rule.design.separation_of_concerns:
    kind: rule
    description: Transport, reservation decisions and physical storage remain with their responsible components.
    rule:
      category: design
      principle: separation_of_concerns
      statement: Transport, reservation decisions and physical storage remain with their responsible components.
      scope: global
      blocking: false
      verification:
      - design_review
  rule.design.modularity:
    kind: rule
    description: Components collaborate through public contracts and can change their internals without
      exposing them to consumers.
    rule:
      category: design
      principle: modularity
      statement: Components collaborate through public contracts and can change their internals without
        exposing them to consumers.
      scope: global
      blocking: false
      verification:
      - design_review
  community.reservation_feature:
    kind: community
    description: Cross-cutting reservation feature view; membership grants no permissions.
