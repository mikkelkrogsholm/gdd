[package]
name = "gdd-concert"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local Sessions concert reservations"
publish = false

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
ntex = { version = "3.12.3", default-features = false, features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
turso = { version = "=0.8.3", default-features = false, features = ["pure-rust-crypto"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["sync", "time"] }
