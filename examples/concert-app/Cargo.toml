[package]
name = "gdd-concert"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
repository = "https://github.com/mikkelkrogsholm/gdd"
description = "Local Sessions concert reservations"
publish = false
include = [
    "/src/**/*.rs", "/src/page/*.html", "/concert_app/static/style.css",
    "/tests/**/*.rs", "/tests/fixtures/recorded-phase-a.db", "/tests/fixtures/over-limit.db",
    "/README.md", "/REQUIREMENTS.md", "/HTTP.md", "/DESIGN.md",
    "/gdd.json", "/model.snapshot.json", "/gdd.records.json", "/graph.gddview",
]

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
ntex = { version = "3.12.3", default-features = false, features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
turso = { version = "=0.8.3", default-features = false, features = ["pure-rust-crypto"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["sync", "time"] }
ureq = { version = "=3.5.0", default-features = false }
