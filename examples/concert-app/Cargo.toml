[package]
name = "gdd-concert"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local Sessions concert reservations"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
turso = { version = "=0.8.3", default-features = false, features = ["pure-rust-crypto"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
