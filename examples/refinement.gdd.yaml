format: gdd/0.2
project:
  id: example.refinement
  title: Decomposition
  goal: Illustrate heterogeneous children and parallel relations.
nodes:
  component.checkout:
    kind: component
    description: Parent checkout boundary.
  action.checkout:
    kind: action
    description: Overall checkout; still a sketch.
    realization:
    - obligation: Authorize payment and save the receipt.
      children:
      - action.charge
      - entity.receipt
  action.charge:
    kind: action
    description: Payment substep; sketch.
  entity.receipt:
    kind: entity
    description: Receipt data; sketch.
  action.record:
    kind: action
    description: Save receipt; sketch.
edges:
- id: edge.checkout.parent
  from: action.checkout
  relation: refines
  to: component.checkout
- id: edge.charge.parent
  from: action.charge
  relation: refines
  to: action.checkout
- id: edge.receipt.parent
  from: entity.receipt
  relation: refines
  to: action.checkout
- id: edge.record.parent
  from: action.record
  relation: refines
  to: action.checkout
- id: edge.charge.calls_record
  from: action.charge
  relation: calls
  to: action.record
- id: edge.charge.depends_record
  from: action.charge
  relation: depends_on
  to: action.record
