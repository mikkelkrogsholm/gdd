[package]
name = "gdd"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Graph-Driven Development tools"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
encoding_rs = "0.8.44"
json-event-parser = "0.2.3"
jsonschema = { version = "0.61.2", default-features = false, features = ["arbitrary-precision"] }
jsonschema-value = { version = "0.61.2", default-features = false, features = ["arbitrary-precision"] }
libyaml-safer = "0.3.0"
num-bigint = "0.4"
oem_cp = "2.1.2"
regex = { version = "1.13", default-features = false, features = ["std", "unicode-age"] }
ruff_python_ast = "=0.0.10"
ruff_python_parser = "=0.0.10"
ruff_text_size = "=0.0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10"
tempfile = "3.27"
unicode-general-category = "1.1"
unicode-ident = "1.0"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[workspace]
members = ["crates/conformance", "crates/viewer"]
default-members = ["."]
