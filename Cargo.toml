[package]
name = "gdd"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Graph-Driven Development tools"
publish = false
include = [
    "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/INSTALL.md", "/SPEC.md", "/VALIDATOR.md",
    "/HOST.md", "/docs/rust-migration.md", "/docs/python-imports.md",
    "/src/**/*.rs", "/schemas/*.schema.json", "/extensions/product-0.1.json",
    "/templates/project/*.json", "/templates/project/SOURCES.md", "/tests/*.rs", "/tests/fixtures/*.rs",
    "/docs/tutorial/refined.gdd.json", "/docs/tutorial/evidence.gdd.json", "/examples/tutorial_prepare.rs",
    "/examples/*.gdd.yaml", "/examples/note.fragment.yaml", "/examples/*.gddview",
    "/examples/concert*.records.yaml", "/examples/concert.snapshot.json",
    "/examples/illustrative.report.json", "/examples/sources/legacy-concert.gdd.yaml",
    "/examples/extensions/sensors.extension.json",
    "/examples/product/*.gdd.json", "/examples/product/greenfield.gddview",
    "/examples/product/extensions/product-0.1.json",
    "/examples/graphify/export.*.json", "/examples/graphify/mapping.json",
    "/examples/graphify/raw.ast.json", "/examples/graphify/observations/*.json",
    "/examples/graphify/observations/README.md",
    "/examples/agent-native/REQUIREMENTS.md", "/examples/agent-native/model.gdd.json",
    "/examples/agent-native/model.records.json", "/examples/agent-native/host.acceptance.json",
    "/examples/agent-native/host.implementation.json", "/examples/agent-native/workflow.*.json",
    "/examples/agent-native/native-run/**/*.json",
]

[[example]]
name = "tutorial_prepare"
test = true

[features]
conformance = []

[dependencies]
clap = { version = "4.6", features = ["derive"] }
encoding_rs = "0.8.44"
json-event-parser = "0.2.3"
jsonschema = { version = "0.61.2", default-features = false, features = ["arbitrary-precision"] }
jsonschema-value = { version = "0.61.2", default-features = false, features = ["arbitrary-precision"] }
libyaml-safer = "0.3.0"
num-bigint = "0.4"
oem_cp = "2.1.2"
regex = { version = "1.13", default-features = false, features = ["std", "unicode-age"] }
ruff_python_ast = "=0.0.10"
ruff_python_parser = "=0.0.10"
ruff_text_size = "=0.0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10"
tempfile = "3.27"
unicode-general-category = "1.1"
unicode-ident = "1.0"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[workspace]
members = ["crates/conformance", "crates/viewer", "docs/tutorial/rust", "examples/concert-app"]
default-members = ["."]
