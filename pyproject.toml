[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gdd-validator"
version = "0.8.0"
description = "Structural validator for Graph-Driven Development 0.3"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "gdd_validator/viewer/vendor/THIRD-PARTY-NOTICES.txt", "gdd_validator/viewer/vendor/licenses/*.txt"]
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.24.0"]

[project.urls]
Repository = "https://github.com/mikkelkrogsholm/gdd"
Issues = "https://github.com/mikkelkrogsholm/gdd/issues"

[project.scripts]
gdd = "gdd_validator.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["gdd_validator"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "gdd_validator/schemas"
"templates/project" = "gdd_validator/templates/project"
"skills/gdd" = "gdd_validator/skill"

[tool.pytest.ini_options]
testpaths = ["tests"]
