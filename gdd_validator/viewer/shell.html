<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'sha256-@@HASH@@'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'"
    />
    <title>GDD · Graph viewer</title>
    <style>
      @@CSS@@;
    </style>
  </head>
  <body>
    <header>
      <div class="brand" aria-label="Graph Driven Development">
        gdd<span class="brand-dot">●</span>
      </div>
      <div class="heading">
        <span class="eyebrow">GRAPH DRIVEN DEVELOPMENT</span>
        <h1 id="project-title"></h1>
      </div>
      <span class="mode">Read-only view · GDD 0.2</span>
      <button id="overview">About the model</button>
    </header>
    <p id="selection-status" class="sr-only" role="status" aria-live="polite"></p>
    <main>
      <aside class="explorer" aria-label="Explore the graph">
        <div class="panel-heading">
          <h2>Explore</h2>
          <span id="total-count" class="quiet"></span>
        </div>
        <label for="search">Search nodes and relations</label>
        <input
          id="search"
          type="search"
          placeholder="ID, description or pseudocode…"
          autocomplete="off"
        />
        <div class="filter-row">
          <div>
            <label for="kind">Node type</label
            ><select id="kind">
              <option value="">All types</option>
            </select>
          </div>
          <div>
            <label for="relation">Relation</label
            ><select id="relation">
              <option value="">All relations</option>
            </select>
          </div>
        </div>
        <label for="community">Community</label
        ><select id="community">
          <option value="">Entire graph</option>
        </select>
        <div class="switch-row">
          <label for="scenarios"
            >Show scenarios <span id="scenario-count"></span></label
          ><input id="scenarios" type="checkbox" />
        </div>
        <div class="switch-row">
          <label for="fold">Fold communities</label
          ><input id="fold" type="checkbox" />
        </div>
        <p class="hint" id="fold-hint">
          Membership is grouping, not ownership.
        </p>
        <div class="list-tabs" role="group" aria-label="Object list">
          <button id="tab-nodes" aria-pressed="true">Nodes</button
          ><button id="tab-edges" aria-pressed="false">Relations</button>
        </div>
        <div
          id="object-list"
          class="object-list"
          aria-label="Visible objects"
        ></div>
        <button id="reset" class="reset">Reset filters and folding</button>
      </aside>
      <section class="stage" aria-label="Interactive graph">
        <div class="stage-toolbar">
          <div>
            <span class="live-dot"></span
            ><span id="view-count" role="status" aria-live="polite"></span>
          </div>
          <button id="manifest-download">Download view manifest</button>
        </div>
        <svg
          id="graph"
          role="img"
          aria-label="GDD graph. Use the object list for keyboard inspection."
        >
          <defs>
            <marker
              id="arrow"
              viewBox="0 0 10 10"
              refX="9"
              refY="5"
              markerWidth="7"
              markerHeight="7"
              orient="auto-start-reverse"
            >
              <path d="M 0 0 L 10 5 L 0 10 z" />
            </marker>
          </defs>
          <g id="viewport">
            <g id="edge-layer"></g>
            <g id="node-layer"></g>
          </g>
        </svg>
        <div id="empty" hidden>
          No nodes match the filters. Reset the filters to see the graph again.
        </div>
        <div class="canvas-note">
          Drag to pan · Scroll to zoom · Select a node or connection
        </div>
        <div class="zoom-controls" role="group" aria-label="Graph navigation">
          <button id="zoom-out" aria-label="Zoom out">−</button
          ><span id="zoom-level">100%</span
          ><button id="zoom-in" aria-label="Zoom in">+</button
          ><button id="fit">Fit</button>
        </div>
      </section>
      <aside id="inspector" class="inspector" aria-label="Details">
        <div id="detail"></div>
      </aside>
    </main>
    <footer>
      <span id="revision"></span><span id="projection-status"></span
      ><span id="renderer-meta"></span>
    </footer>
    <script id="gdd-data" type="application/json">@@DATA@@</script>
    <script>@@SCRIPT@@</script>
  </body>
</html>
